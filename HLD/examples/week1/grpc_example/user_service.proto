// user_service.proto
// Protocol Buffer definition for User Service
// Demonstrates gRPC service definition and protobuf messages

syntax = "proto3";

package userservice;

// User Service definition
service UserService {
  // Unary RPC: Simple request-response
  rpc GetUser(GetUserRequest) returns (UserResponse) {}

  // Unary RPC: Create user
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {}

  // Server streaming: Get multiple users as stream
  rpc ListUsers(ListUsersRequest) returns (stream UserResponse) {}

  // Client streaming: Batch create users
  rpc BatchCreateUsers(stream CreateUserRequest) returns (BatchCreateResponse) {}

  // Bidirectional streaming: Real-time chat
  rpc Chat(stream ChatMessage) returns (stream ChatMessage) {}
}

// Request message for GetUser
message GetUserRequest {
  int32 id = 1;
}

// Request message for CreateUser
message CreateUserRequest {
  string name = 1;
  string email = 2;
  int32 age = 3;
}

// Request message for ListUsers
message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string filter = 3;
}

// Response message for User operations
message UserResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
  int32 age = 4;
  string created_at = 5;
  string updated_at = 6;
}

// Response for batch operations
message BatchCreateResponse {
  int32 created_count = 1;
  repeated UserResponse users = 2;
}

// Chat message
message ChatMessage {
  string username = 1;
  string message = 2;
  string timestamp = 3;
}

// Common message types
message Empty {}

message Status {
  int32 code = 1;
  string message = 2;
}
